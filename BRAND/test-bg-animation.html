<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI SaaS Background — Purple Cyan</title>
  <style>
    :root {
      --bg: #07060f;
      --purple-1: #8b5cf6;
      --purple-2: #a78bfa;
      --purple-3: #6d28d9;
      --cyan-1: #22d3ee;
      --cyan-2: #06b6d4;
      --cyan-3: #67e8f9;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: system-ui, -apple-system, sans-serif;
    }

    .bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    /* Base radial atmosphere */
    .bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(139, 92, 246, 0.18), transparent 60%),
        radial-gradient(ellipse 70% 50% at 80% 70%, rgba(34, 211, 238, 0.14), transparent 55%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(109, 40, 217, 0.1), transparent 50%);
      pointer-events: none;
    }

    /* Animated blobs (óvalos) */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
      will-change: transform, opacity;
      mix-blend-mode: screen;
    }

    .blob-1 {
      width: 55vmax;
      height: 45vmax;
      top: -15%;
      left: -10%;
      background: radial-gradient(circle at 30% 40%, var(--purple-1), transparent 70%);
      animation: float1 22s ease-in-out infinite alternate;
    }

    .blob-2 {
      width: 50vmax;
      height: 55vmax;
      top: 35%;
      right: -15%;
      background: radial-gradient(circle at 60% 50%, var(--cyan-1), transparent 70%);
      animation: float2 26s ease-in-out infinite alternate;
      animation-delay: -4s;
    }

    .blob-3 {
      width: 40vmax;
      height: 40vmax;
      bottom: -10%;
      left: 25%;
      background: radial-gradient(circle at 40% 60%, var(--purple-2), transparent 70%);
      animation: float3 19s ease-in-out infinite alternate;
      animation-delay: -8s;
    }

    .blob-4 {
      width: 35vmax;
      height: 30vmax;
      top: 15%;
      left: 45%;
      background: radial-gradient(circle at 50% 50%, var(--cyan-2), transparent 70%);
      opacity: 0.4;
      animation: float4 24s ease-in-out infinite alternate;
      animation-delay: -2s;
    }

    .blob-5 {
      width: 28vmax;
      height: 32vmax;
      bottom: 20%;
      right: 20%;
      background: radial-gradient(circle at 50% 50%, var(--purple-3), transparent 70%);
      opacity: 0.35;
      animation: float5 28s ease-in-out infinite alternate;
      animation-delay: -6s;
    }

    /* Soft morphing ovals (más orgánicos) */
    .oval {
      position: absolute;
      filter: blur(60px);
      opacity: 0.45;
      will-change: transform, border-radius;
      mix-blend-mode: screen;
    }

    .oval-1 {
      width: 45vmax;
      height: 30vmax;
      top: 10%;
      left: 30%;
      background: linear-gradient(135deg, var(--cyan-3), var(--purple-1));
      border-radius: 60% 40% 50% 50% / 50% 60% 40% 50%;
      animation: morph1 18s ease-in-out infinite alternate;
    }

    .oval-2 {
      width: 38vmax;
      height: 42vmax;
      bottom: 5%;
      right: 10%;
      background: linear-gradient(225deg, var(--purple-2), var(--cyan-1));
      border-radius: 40% 60% 50% 40% / 60% 40% 60% 50%;
      animation: morph2 21s ease-in-out infinite alternate;
      animation-delay: -5s;
    }

    /* Subtle noise / grain overlay (opcional, da look premium) */
    .grain {
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.035;
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    /* Content example (puedes borrar o personalizar) */
    .content {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      padding: 2rem;
      pointer-events: none;
    }

    .content h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #e0e7ff 0%, #a5f3fc 50%, #c4b5fd 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.75rem;
    }

    .content p {
      font-size: 1.15rem;
      color: rgba(226, 232, 240, 0.75);
      max-width: 32rem;
      line-height: 1.6;
    }

    /* Keyframes — estilo Framer Motion (suave, orgánico) */
    @keyframes float1 {
      0%   { transform: translate(0, 0) scale(1) rotate(0deg); }
      33%  { transform: translate(8%, 12%) scale(1.08) rotate(4deg); }
      66%  { transform: translate(-5%, 6%) scale(0.95) rotate(-3deg); }
      100% { transform: translate(4%, -8%) scale(1.03) rotate(2deg); }
    }

    @keyframes float2 {
      0%   { transform: translate(0, 0) scale(1) rotate(0deg); }
      40%  { transform: translate(-10%, -8%) scale(1.1) rotate(-5deg); }
      70%  { transform: translate(6%, 10%) scale(0.92) rotate(3deg); }
      100% { transform: translate(-4%, 4%) scale(1.05) rotate(-2deg); }
    }

    @keyframes float3 {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(12%, -10%) scale(1.12); }
      100% { transform: translate(-6%, 8%) scale(0.96); }
    }

    @keyframes float4 {
      0%   { transform: translate(0, 0) scale(1) rotate(0deg); }
      100% { transform: translate(-12%, 15%) scale(1.15) rotate(8deg); }
    }

    @keyframes float5 {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(10%, -12%) scale(1.08); }
    }

    @keyframes morph1 {
      0%   {
        transform: translate(0, 0) scale(1);
        border-radius: 60% 40% 50% 50% / 50% 60% 40% 50%;
      }
      50%  {
        transform: translate(6%, -5%) scale(1.06);
        border-radius: 40% 60% 45% 55% / 55% 45% 60% 40%;
      }
      100% {
        transform: translate(-4%, 8%) scale(0.97);
        border-radius: 55% 45% 60% 40% / 45% 55% 40% 60%;
      }
    }

    @keyframes morph2 {
      0%   {
        transform: translate(0, 0) scale(1);
        border-radius: 40% 60% 50% 40% / 60% 40% 60% 50%;
      }
      50%  {
        transform: translate(-8%, 6%) scale(1.09);
        border-radius: 55% 45% 40% 60% / 40% 60% 50% 50%;
      }
      100% {
        transform: translate(5%, -4%) scale(0.94);
        border-radius: 45% 55% 55% 45% / 50% 50% 45% 55%;
      }
    }

    /* Accesibilidad */
    @media (prefers-reduced-motion: reduce) {
      .blob, .oval {
        animation: none !important;
      }
    }

    /* Mobile tweak */
    @media (max-width: 640px) {
      .blob, .oval {
        filter: blur(55px);
      }
    }
  </style>
</head>
<body>
  <div class="bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
    <div class="blob blob-5"></div>

    <div class="oval oval-1"></div>
    <div class="oval oval-2"></div>

    <div class="grain"></div>
  </div>

  <!-- Contenido de ejemplo (elimínalo o personalízalo) -->
  <div class="content">
    <h1>AI SaaS Background</h1>
    <p>Purple + Cyan · Animated blobs &amp; ovals · Modern ambient style</p>
  </div>
</body>
</html>
