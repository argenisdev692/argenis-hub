; Production overrides for the CLI SAPI, which is what `artisan serve`, the
; queue worker and the scheduler all run under in this image.
;
; PHP's stock limits truncate uploads at 2 MB and cap a process at 128 MB,
; which is too low for CRM document uploads and for Imagick/dompdf rendering.
; Override per service with PHP_CLI_SERVER_WORKERS / container memory if a
; deployment needs different numbers.
memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 48M

; Do not advertise the PHP version (OWASP: information exposure).
expose_php = Off

; Opcache ships bundled in php8.6-common (there is no separate php8.6-opcache
; package since 8.5). The directive is ignored if the extension is absent.
opcache.enable_cli = 1
